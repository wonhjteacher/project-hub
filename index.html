<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROJECT HUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- 전환 애니메이션(0.6초) 동안 다음 문서를 미리 받아둔다 -->
    <link rel="prefetch" href="project-list.html" />

    <style>
      /* ============================================================
   DESIGN_PROJECT_HUB.md 9장 — 디자인 토큰
   ============================================================ */
      :root {
        /* Color */
        --bg-base: #121212;
        --bg-surface: #1a1a1a;
        --bg-elevated: #222222;

        --text-primary: #f5f5f5; /* 순백 아님 — 헤일레이션 방지 (3.3) */
        --text-secondary: #a1a1aa;
        --text-tertiary: #8a8a8f;

        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --on-accent: #0a0a0a; /* 흰색 아님 — 대비 5.4:1 (3.3) */

        --line-subtle: rgba(255, 255, 255, 0.08);

        /* Font */
        --font-en: "Inter", system-ui, -apple-system, sans-serif;
        --font-kr: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;

        /* Type scale */
        --fs-logo: clamp(3rem, 8vw, 6rem);
        --fs-body: 1rem;
        --fs-label: 0.75rem;

        /* Space (4px 기반) */
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-12: 48px;

        --radius-sm: 6px;
        --radius-md: 12px; /* DESIGN 5.4 */
        --radius-lg: 16px;

        /* Motion */
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
        --dur-fast: 150ms;
        --dur-base: 300ms;
        --dur-slow: 600ms;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-kr);
        font-size: var(--fs-body);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        overflow: hidden; /* 산포 연출 중 글자가 넘쳐도 스크롤바가 생기지 않게 */
      }

      /* ============================================================
   6.1 인트로 화면
   ============================================================ */
      .intro {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        text-align: center;
        will-change: transform, opacity; /* 7.2 줌 인 전환 대비 */
      }

      @media (min-width: 768px) {
        .intro {
          padding: 0 40px;
        }
      }

      /* "vibe coding" — 로고 위 작은 라벨 (--fs-label, 영문 전용) */
      .intro__eyebrow {
        font-family: var(--font-en);
        font-size: var(--fs-label);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 0 0 var(--space-4);
        line-height: 1;
      }

      /* 4.4 로고 타입 상세 스펙 */
      .intro__logo {
        font-family: var(--font-en);
        font-size: var(--fs-logo);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        text-transform: uppercase;
        line-height: 1.05;
        margin: 0;
        /* 산포 연출 중 글자가 회전해도 잘리지 않도록 여유를 준다 */
        padding: 0.1em 0;
      }

      /* SplitText가 만든 각 글자. transform이 걸리므로 inline-block이 필수 */
      .intro__logo .char {
        display: inline-block;
        will-change: transform, opacity;
      }

      /* 로고 ↔ 버튼 간격 = --space-12 (48px) */
      .intro__enter {
        margin-top: var(--space-12);
        min-width: 160px;
        min-height: 52px;
        padding: var(--space-4) var(--space-6);

        font-family: var(--font-en);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        color: var(--on-accent);
        background: var(--accent);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;

        transition: background var(--dur-fast) var(--ease-out);
      }

      .intro__enter:hover {
        background: var(--accent-hover);
      }

      .intro__enter:focus-visible {
        outline: 2px solid var(--accent-hover);
        outline-offset: 3px;
      }

      /* 진입 힌트 — 스킵 가능하다는 사실을 알린다 (R2 안전장치) */
      .intro__hint {
        position: absolute;
        bottom: var(--space-12);
        left: 0;
        right: 0;
        font-family: var(--font-en);
        font-size: var(--fs-label);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin: 0;
      }

      /* 자바스크립트가 꺼져 있어도 콘텐츠는 보여야 한다 */
      .no-js .intro__logo .char {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </head>

  <body class="no-js">
    <!-- 화면 1 — 인트로 (PRD 5.1) -->
    <section class="intro" id="intro">
      <p class="intro__eyebrow">vibe coding</p>

      <h1 class="intro__logo" id="logo">Project Hub</h1>

      <button class="intro__enter" id="enter" type="button">Enter</button>

      <p class="intro__hint" id="hint">press enter</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script>
      document.body.classList.remove("no-js");

      gsap.registerPlugin(SplitText);

      const introEl = document.getElementById("intro");
      const logoEl = document.getElementById("logo");
      const enterEl = document.getElementById("enter");
      const hintEl = document.getElementById("hint");

      // INT-03 — 진입 대상
      const LIST_URL = "project-list.html";

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      let entering = false; // 전환이 이미 시작됐는지 (중복 실행 방지)

      /* --------------------------------------------------------
     등장 — SplitText 산포 (DESIGN 7.1 개정)
     글자를 제각각 흩뿌린 상태에서 제자리로 수렴시킨다.
     -------------------------------------------------------- */
      function playIntro() {
        // 폰트가 로드되기 전에 쪼개면 글자 폭이 어긋난다.
        const split = SplitText.create(logoEl, {
          type: "chars",
          charsClass: "char",
        });

        const tl = gsap.timeline();

        tl.from(split.chars, {
          duration: 1.2,
          opacity: 0,
          scale: 0.6,
          // 함수를 넘기면 GSAP이 글자마다 호출해 서로 다른 난수를 뽑는다.
          // 상수를 넘기면 모든 글자가 똑같이 움직여 산포가 되지 않는다.
          x: () => gsap.utils.random(-200, 200),
          y: () => gsap.utils.random(-200, 200),
          rotation: () => gsap.utils.random(-60, 60),
          ease: "power4.out",
          stagger: { each: 0.03, from: "random" },
        }).from(
          [enterEl, hintEl],
          {
            duration: 0.4,
            opacity: 0,
            y: 12,
            ease: "power2.out",
            stagger: 0.06,
          },
          "-=0.35",
        );

        return tl;
      }

      /* --------------------------------------------------------
     전환 — 줌 인 후 리스트 페이지로 이동 (INT-03)
     DESIGN 7.2 / INT-04 상한(0.8초) 안쪽인 0.6초를 유지한다.
     이동은 애니메이션이 끝난 뒤에 건다. 먼저 걸면 브라우저가
     문서를 바꾸느라 마지막 프레임을 떨어뜨린다.
     -------------------------------------------------------- */
      function goToList() {
        if (entering) return;
        entering = true;

        if (reduceMotion) {
          location.href = LIST_URL;
          return;
        }

        gsap
          .timeline({
            onComplete: () => {
              location.href = LIST_URL;
            },
          })
          .to(introEl, {
            duration: 0.6,
            scale: 1.6,
            opacity: 0,
            ease: "power2.inOut", // --ease-inout 근사 (CustomEase 없이)
            pointerEvents: "none",
          });
      }

      /* --------------------------------------------------------
     R2 안전장치 — 연출 중 어떤 입력이든 즉시 건너뛴다
     -------------------------------------------------------- */
      let intro = null;

      function skipIntro() {
        if (intro && intro.progress() < 1) {
          intro.progress(1);
          return true; // 이번 입력은 "스킵"으로 소비하고 전환하지 않는다
        }
        return false;
      }

      if (reduceMotion) {
        // 줌·산포를 생략하고 즉시 완성 상태로 둔다
        intro = null;
      } else {
        // 폰트 로드 후에 쪼개야 글자 폭이 어긋나지 않는다
        document.fonts.ready.then(() => {
          intro = playIntro();
        });
      }

      enterEl.addEventListener("click", () => {
        if (skipIntro()) return;
        goToList();
      });

      // INT-05 — 키보드 Enter로도 진입
      window.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          // 버튼에 포커스가 있으면 click 이벤트가 따로 발생하므로 중복 처리하지 않는다
          if (document.activeElement === enterEl) return;
          e.preventDefault();
          if (skipIntro()) return;
          goToList();
          return;
        }
        skipIntro();
      });

      // 화면 아무 곳이나 클릭해도 연출은 건너뛴다 (전환은 ENTER로만)
      introEl.addEventListener("click", (e) => {
        if (e.target === enterEl) return;
        skipIntro();
      });

      /* --------------------------------------------------------
     뒤로가기 복원 — bfcache는 "떠날 때 모습"을 그대로 되살린다.
     즉 줌 아웃되어 사라진 인트로가 그대로 복원돼 빈 화면이 된다.
     전환 상태를 되돌려 다시 조작할 수 있게 만든다.
     -------------------------------------------------------- */
      window.addEventListener("pageshow", (e) => {
        if (!e.persisted) return;
        entering = false;
        gsap.set(introEl, { clearProps: "all" });
      });
    </script>
  </body>
</html>
